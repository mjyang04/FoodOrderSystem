[project]
name = "fos-ai"
version = "0.1.0"
description = "AI microservice for FoodOrderSystem — semantic search, recommendations, NL order parsing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "anthropic>=0.42.0",
    "openai>=1.50.0",
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "mysql-connector-python>=9.0.0",
    "numpy>=1.26.0",
    "qdrant-client>=1.17.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.4.1",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp>=1.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "respx>=0.22.0",
]
training = [
    "peft>=0.13",
    # trl 0.20+ removed DataCollatorForCompletionOnlyLM used by intent train.py
    "trl>=0.11,<0.20",
    "datasets>=3.0",
    "accelerate>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fos_ai", "training/fos_ai_training"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: quality evaluation against labelled datasets (run with `pytest eval/ -m eval`)",
]
# ``eval/`` is intentionally outside ``testpaths`` so unit runs stay fast;
# invoke explicitly: ``pytest eval/ -m eval``.
